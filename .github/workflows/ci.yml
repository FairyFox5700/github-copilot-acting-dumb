name: Verify workshop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            demo/web/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Confirm intentional red baseline
        run: |
          chmod +x scripts/*.sh
          ./scripts/reset-demo.sh
          ./scripts/verify-baseline.sh
      - name: Verify deterministic known fix
        run: |
          ./scripts/apply-context.sh
          ./scripts/apply-known-fix.sh
          ./scripts/verify-fixed.sh
      - name: Check production-deploy hook
        run: |
          allowed=$(printf '%s' '{"toolName":"bash","toolArgs":{"command":"npm run build"}}' | node .github/hooks/block-production-deploy.mjs)
          blocked=$(printf '%s' '{"toolName":"bash","toolArgs":{"command":"vercel --prod"}}' | node .github/hooks/block-production-deploy.mjs)
          echo "$allowed" | grep '"permissionDecision":"allow"'
          echo "$blocked" | grep '"permissionDecision":"deny"'
      - name: Restore intentional baseline
        run: |
          ./scripts/reset-demo.sh
          ./scripts/verify-baseline.sh
